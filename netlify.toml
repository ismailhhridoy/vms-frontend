[build]
  publish = "build/web"
  command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter && ./_flutter/bin/flutter build web --release --dart-define=API_BASE_URL=${API_BASE_URL:-http://localhost:8080/api/v1}"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

